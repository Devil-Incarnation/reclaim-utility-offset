<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Northline Utilities | Account Dashboard</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="shell">
      <header>
        <div class="brand">Northline Utilities</div>
        <div>Customer portal</div>
      </header>
      <main class="card" aria-labelledby="dashboard-title">
        <h1 id="dashboard-title">Account dashboard</h1>
        <p class="lede">Service address 18 Cedar Row · billing cycle Sep 2026</p>
        <dl class="stats">
          <div class="stat">
            <dt>Account ID</dt>
            <dd id="account-id-value">100245890</dd>
          </div>
          <div class="stat">
            <dt>Electricity usage</dt>
            <dd>
              <div id="kwh-usage">450 kWh</div>
            </dd>
          </div>
          <div class="stat">
            <dt>Statement status</dt>
            <dd>Paid</dd>
          </div>
        </dl>
      </main>
    </div>
  </body>
</html>
